<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти | SmartLand Панагюрище</title>
    <link rel="icon" type="image/png" href="favicon.png" sizes="64x64">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* --- ГЛОБАЛНИ И ХЕДЪР СТИЛОВЕ (ОТ INDEX.HTML) --- */
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --accent: #ff0055;
            --dark-bg: #0a0a0a;
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
            --card-bg: #131313;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background-color: var(--dark-bg); color: var(--text-main); overflow-x: hidden; }
        a { text-decoration: none; transition: 0.3s; color: inherit; }
        ul { list-style: none; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 2px; }

        /* HEADER CSS */
        header {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px;
            background: rgba(10, 10, 10, 0.75) !important;
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            z-index: 1000;
            display: flex; align-items: center; justify-content: space-between; padding: 0 5%; 
        }
        .logo { position: relative; z-index: 1001; cursor: pointer; text-decoration: none; color: #fff; font-size: 24px; font-weight: 700; }
        .logo span { color: var(--primary); }
        nav { flex-grow: 1; display: flex; justify-content: center; }
        nav ul { display: flex; gap: 30px; margin: 0; padding: 0; list-style: none; }
        nav a { font-size: 14px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; transition: 0.3s; }
        nav a:hover, nav a.active { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        .btn-call { white-space: nowrap; padding: 10px 20px; border: 2px solid var(--primary); color: var(--primary); border-radius: 5px; font-weight: bold; font-family: 'Roboto', sans-serif; transition: 0.3s; }
        .btn-call:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px rgba(0, 210, 255, 0.6); }
        
        /* МОБИЛНО МЕНЮ */
        .mobile-menu-btn { display: none; color: var(--primary); font-size: 24px; cursor: pointer; transition: 0.3s; }
        .header-right { display: flex; align-items: center; gap: 15px; }

        @media (max-width: 980px) {
            header { padding: 0 20px; }
            .mobile-menu-btn { display: block; }
            nav {
                position: fixed; top: 80px; left: -100%; width: 100%; height: calc(100vh - 80px);
                background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(15px);
                transition: 0.4s ease-in-out; flex-direction: column; justify-content: flex-start !important; padding-top: 50px; z-index: 999;
            }
            nav.active { left: 0; }
            nav ul { flex-direction: column; gap: 30px !important; align-items: center; }
            nav a { font-size: 20px !important; width: 100%; text-align: center; }
        }

        /* CONTACT SPECIFIC STYLES */
        .contact-hero {
            height: 50vh; margin-top: 80px; position: relative; display: flex; align-items: center; justify-content: center; text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), var(--dark-bg)), url('https://images.unsplash.com/photo-1593640408182-31c70c8268f5?q=80&w=1920&auto=format&fit=crop'); 
            background-size: cover; background-position: center;
        }
        .contact-hero-content { z-index: 2; padding: 40px; background: rgba(10,10,10,0.6); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); }
        .contact-hero h1 { font-size: 3rem; margin-bottom: 10px; color: #fff; }
        .contact-hero p { color: var(--primary); font-size: 1.2rem; letter-spacing: 1px; }

        .contact-section { padding: 60px 5%; max-width: 1200px; margin: 0 auto; }
        .info-cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
        .info-card { background: var(--card-bg); padding: 40px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; align-items: center; text-align: center; transition: 0.3s; position: relative; overflow: hidden; }
        .info-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--primary); transform: scaleX(0); transition: 0.3s; transform-origin: left; }
        .info-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0, 210, 255, 0.1); }
        .info-card:hover::before { transform: scaleX(1); }
        .info-card i { font-size: 2.5rem; color: var(--primary); margin-bottom: 20px; background: rgba(0, 210, 255, 0.1); width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .info-card h3 { font-size: 1.3rem; margin-bottom: 10px; color: #fff; }
        .info-card p { color: var(--text-dim); font-size: 1.1rem; line-height: 1.6; }

        .map-section { margin-top: 80px; height: 500px; width: 100%; position: relative; border-top: 1px solid var(--primary); border-bottom: 1px solid var(--primary); }
        .map-frame { width: 100%; height: 100%; border: 0; }

        @media (max-width: 768px) { .info-cards-grid { grid-template-columns: 1fr; } .contact-hero h1 { font-size: 2rem; } }

        /* FOOTER */
        .main-footer { background: #050505; color: var(--text-main); padding: 60px 0 20px 0; }
        .footer-container { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; padding: 0 5%; gap: 40px; }
        .footer-col { flex: 1; min-width: 250px; }
        .footer-col h3 { color: var(--primary); font-size: 1.2rem; margin-bottom: 25px; position: relative; font-family: 'Orbitron', sans-serif; }
        .footer-col h3::after { content: ''; position: absolute; left: 0; bottom: -8px; width: 40px; height: 2px; background: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .footer-col p { color: var(--text-dim); font-size: 0.95rem; line-height: 1.7; margin-bottom: 20px; }
        .social-icons { display: flex; gap: 15px; }
        .social-icons a { width: 35px; height: 35px; background: #111; display: flex; align-items: center; justify-content: center; border-radius: 5px; border: 1px solid #333; transition: 0.3s; color: #fff; }
        .social-icons a:hover { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .footer-links { list-style: none; padding: 0; }
        .footer-links li { margin-bottom: 12px; }
        .footer-links a { color: var(--text-dim); transition: 0.3s; font-size: 0.95rem; }
        .footer-links a:hover { color: var(--primary); padding-left: 10px; }
        .contact-details { list-style: none; padding: 0; }
        .contact-details li { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; color: var(--text-dim); font-size: 0.95rem; }
        .contact-details i { color: var(--primary); font-size: 1.1rem; }
        .footer-bottom { text-align: center; padding-top: 40px; margin-top: 40px; border-top: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.85rem; color: #555; }
        @media (max-width: 768px) {
            .footer-container { flex-direction: column; text-align: center; }
            .footer-col h3::after { left: 50%; transform: translateX(-50%); }
            .contact-details li, .social-icons { justify-content: center; }
        }
    </style>


    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-E857EJ237H"></script>
<script>

  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-E857EJ237H');
</script>


</head>
<body>

<div id="header-placeholder"></div>

    <section class="contact-hero">
        <div class="contact-hero-content">
            <h1>СВЪРЖЕТЕ СЕ С НАС</h1>
            <p>ВИЖТЕ КЪДЕ ДА НИ ОТКРИЕТЕ</p>
        </div>
    </section>

    <section class="contact-section">
        <div class="info-cards-grid">
            <div class="info-card">
                <i class="fas fa-map-marker-alt"></i>
                <h3>АДРЕС</h3>
                <p>гр. Панагюрище<br>ул. „Цар Освободител“ 43</p>
            </div>
            <div class="info-card">
                <i class="fas fa-phone-alt"></i>
                <h3>ТЕЛЕФОН</h3>
                <p><a href="tel:0988835555" style="color: #fff; font-weight: bold;">098 883 5555</a></p>
            </div>
            <div class="info-card">
                <i class="fas fa-envelope"></i>
                <h3>ИМЕЙЛ</h3>
                <p><a href="mailto:thilsey13542@gmail.com" style="color: #fff;">thilsey13542@gmail.com</a></p>
            </div>
            <div class="info-card">
                <i class="fas fa-clock"></i>
                <h3>РАБОТНО ВРЕМЕ</h3>
                <p>Понеделник - Петък<br>09:00 - 17:30</p>
            </div>
        </div>
    </section>

    <section class="map-section">
        <iframe class="map-frame" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4105.804305274418!2d24.1793804!3d42.50278019999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x40aa0317db701641%3A0x213c3e47891a0a6!2z0KHQvNCw0YDRgtCb0LXQvdC0INCe0J7QlA!5e1!3m2!1sbg!2sbg!4v1771197333894!5m2!1sbg!2sbg" allowfullscreen="" loading="lazy"></iframe>
    </section>

    <footer class="main-footer">
        <div id="footer-placeholder"></div>
    </footer>

    <script>
        // ЗАДЪЛЖИТЕЛЕН СКРИПТ ЗА МЕНЮТО
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                
                const menuBtn = document.getElementById('mobile-menu-trigger');
                const navMenu = document.getElementById('nav-menu');

                if(menuBtn && navMenu) {
                    menuBtn.addEventListener('click', () => {
                        navMenu.classList.toggle('active');
                        const icon = menuBtn.querySelector('i');
                        if(icon) {
                            icon.classList.toggle('fa-bars');
                            icon.classList.toggle('fa-times');
                        }
                    });
                }

                const currentPath = window.location.pathname;
                const navLinks = document.querySelectorAll('nav ul li a');
                navLinks.forEach(link => {
                    if (currentPath.includes('contact.html') && (link.getAttribute('href').includes('contact') || link.getAttribute('href').includes('#contacts'))) {
                        link.classList.add('active');
                    }
                });
            });

        // ФУТЪР
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.querySelector('.main-footer').innerHTML = data;
            });
    </script>
</body>
</html>
